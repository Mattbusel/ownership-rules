name: publish

# Push a tag like v0.1.0 to build the sdist and wheel, test them, attach them to a GitHub release and upload them
# to PyPI as `ownership-rules` with trusted publishing (no API token stored here).
#
# One-time setup on pypi.org (Account settings -> Publishing -> Add a new pending publisher): project name
# ownership-rules, owner Mattbusel, repository ownership-rules, workflow publish.yml, environment pypi.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: github.event_name == 'push'
        run: |
          module=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/ownership_rules/__init__.py').read()).group(1))")
          echo "tag=${GITHUB_REF_NAME} module=${module}"
          test "${GITHUB_REF_NAME}" = "v${module}"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the wheel
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl
          cd /tmp && /tmp/w/bin/ownership-rules vectors
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release with the wheel, sdist and vectors attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd vectors && zip -r ../dist/ownership-rules-vectors-${GITHUB_REF_NAME}.zip .)
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {p=1; next} /^## / && p {exit} p' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" dist/* --title "ownership-rules ${GITHUB_REF_NAME}" --notes "$notes"

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    # Until the PyPI pending publisher exists the upload fails; the GitHub release above is still the release.
    continue-on-error: true
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
