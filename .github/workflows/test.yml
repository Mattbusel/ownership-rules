name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q src tests
      - name: Vectors through the installed command
        run: ownership-rules vectors

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mypy
      - name: The shipped package type-checks under mypy --strict (it ships py.typed)
        run: python -m mypy --strict src/ownership_rules

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, then test the wheel outside the source tree
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl
          cd /tmp
          /tmp/w/bin/ownership-rules vectors
          /tmp/w/bin/python -c "import ownership_rules, os; d = ownership_rules.vectors.vector_dir(); assert os.path.isfile(os.path.join(d, 'ofac', 'ofac-50.json')), d; print(d)"
